name: Build and release portable TTC
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release tag (for example v1.3.0)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build-and-release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected vMAJOR.MINOR.PATCH' }
      - name: Build checksum-pinned native engine
        run: ./build-windows.ps1
      - name: Install pinned detector dependencies
        run: |
          python -m pip install --only-binary=:all: --target build/python-deps -r local/requirements-vlad.txt
          if ($LASTEXITCODE -ne 0) { throw 'Detector dependencies failed' }
      - name: Verify service and viewer
        run: |
          python -B tests/local_checks.py
          if ($LASTEXITCODE -ne 0) { throw 'Service checks failed' }
          node --test web/tests/viewer.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Viewer tests failed' }
          node --check web/viewer.js
          if ($LASTEXITCODE -ne 0) { throw 'Viewer syntax failed' }
      - name: Package and smoke-test isolated runtime
        run: |
          $runtime = python -c "import sys; print(sys.base_prefix)"
          python -B local/package_windows.py --runtime "$runtime" --engine build/ttc-simple.exe --licenses build/licenses --output build/TTC-windows-x64 --zip
          if ($LASTEXITCODE -ne 0) { throw 'Portable packaging failed' }
          $hash = (Get-FileHash build/TTC-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TTC-windows-x64.zip" | Set-Content build/SHA256SUMS.txt -Encoding ascii
      - name: Attest package provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: build/TTC-windows-x64.zip
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            build/TTC-windows-x64.zip
            build/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Download **TTC-windows-x64.zip** (not the source-code archives), verify it against **SHA256SUMS.txt**, and extract the complete folder.
            Launch **Launch TTC.vbs** or run **ttc.cmd serve**. Windows x64; no Python installation required.

            This package is unsigned. Checksums detect changed bytes; they do not guarantee safety. GitHub build provenance is attached to the ZIP.
            For a cautious first run, use Windows Sandbox or a disposable VM with networking disabled and only a read-only folder of test captures.
            High-resolution DNGs require several GB of RAM and ample output space.

            Capture recipe, first-run walkthrough and safety guidance: https://hsnilsson.github.io/ttc/
